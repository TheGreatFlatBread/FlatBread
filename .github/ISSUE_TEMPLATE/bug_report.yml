name: 🐛 버그 리포트
description: 버그나 오류를 발견했을 때 사용하세요
title: "[Bug] "
labels: ["bug"]

body:
  - type: textarea
    id: bug-description
    attributes:
      label: 🧭 버그 설명
      description: 어떤 버그가 발생했는지 명확하게 설명해주세요
      placeholder: ex. 로그인 시도 시 앱 크래시 / 피드 스크롤 시 데이터 중복 표시
    validations:
      required: true

  - type: textarea
    id: reproduce-steps
    attributes:
      label: 📱 재현 방법
      description: 버그를 재현하기 위한 단계를 순서대로 작성해주세요
      placeholder: |
        1. 앱 실행
        2. 홈 화면에서 '로그인' 버튼 탭
        3. 이메일/비밀번호 입력 후 로그인 시도
        4. 앱 크래시 발생
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ 예상 동작
      description: 정상적으로 동작했을 때 어떻게 되어야 하는지 설명해주세요
      placeholder: ex. 로그인 성공 후 메인 화면으로 이동
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: ❌ 실제 동작
      description: 실제로 어떤 문제가 발생했는지 설명해주세요
      placeholder: ex. 로그인 버튼 탭 후 앱이 종료됨
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📸 스크린샷 / 로그
      description: 스크린샷, 에러 로그, 콘솔 출력 등을 첨부해주세요
      placeholder: |
        스크린샷을 드래그 앤 드롭하거나 붙여넣기 하세요

        에러 로그가 있다면 아래에 붙여넣기:
        ```
        에러 로그
        ```
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: 📱 디바이스
      description: 버그가 발생한 디바이스를 입력해주세요
      placeholder: ex. iPhone 14 Pro / iPad Air
    validations:
      required: true

  - type: dropdown
    id: ios-version
    attributes:
      label: 🌍 iOS 버전
      description: iOS 버전을 선택해주세요
      options:
        - iOS 18.x
        - iOS 17.x
        - iOS 16.x
        - iOS 15.x
        - iOS 14.x
        - 기타
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 📦 앱 버전
      description: 앱 버전을 입력해주세요
      placeholder: ex. v1.0.0
    validations:
      required: false

  - type: dropdown
    id: build-environment
    attributes:
      label: 🔧 빌드 환경
      description: 어떤 빌드 환경에서 발생했나요
      options:
        - Debug
        - Release
        - 모름
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 💬 추가 정보
      description: 이 버그와 관련된 추가적인 컨텍스트나 정보가 있다면 작성해주세요
      placeholder: ex. 특정 네트워크 환경에서만 발생 / 다크모드에서만 발생
    validations:
      required: false
