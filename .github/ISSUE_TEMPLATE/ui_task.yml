name: 🎨 UI 작업
description: 새로운 화면, 컴포넌트, 애니메이션 등을 구현할 때 사용하세요
title: "[UI] "
labels: ["ui"]

body:
  - type: textarea
    id: ui-purpose
    attributes:
      label: 🧭 목적
      description: 어떤 화면/컴포넌트를 구현하는지 설명해주세요
      placeholder: ex. 홈 피드 UI / 프로필 편집 화면 / 러닝 상세 그래프
    validations:
      required: true

  - type: textarea
    id: ui-tasks
    attributes:
      label: 🧱 작업 내용
      description: 구체적인 UI 구현 단위를 체크리스트로 작성해주세요
      placeholder: |
        - [ ] 뷰 구조 및 오토레이아웃 설정
        - [ ] ViewModel 및 바인딩 구성
        - [ ] 애니메이션 / 제스처 추가
        - [ ] 다크모드 및 접근성 대응 확인
      value: |
        - [ ] 뷰 구조 및 오토레이아웃 설정
        - [ ] ViewModel 및 바인딩 구성
        - [ ] 애니메이션 / 제스처 추가
        - [ ] 다크모드 및 접근성 대응 확인
    validations:
      required: true

  - type: dropdown
    id: ui-screen-type
    attributes:
      label: 📱 화면 유형
      description: 작업하는 UI의 유형을 선택해주세요
      options:
        - 새로운 화면
        - 기존 화면 수정
        - 컴포넌트
        - 애니메이션
        - 기타
    validations:
      required: false

  - type: input
    id: related-issue
    attributes:
      label: 🔗 관련 이슈 (선택)
      description: 관련된 이슈가 있다면 번호를 적어주세요
      placeholder: "ex. #14"
    validations:
      required: false

  - type: textarea
    id: design-reference
    attributes:
      label: 📎 참고 자료
      description: 디자인 시안, Figma 링크, 스크린샷 등을 첨부해주세요
      placeholder: |
        - Figma: https://...
        - 디자인 시안 첨부 (이미지를 드래그 앤 드롭)
    validations:
      required: false

  - type: checkboxes
    id: accessibility-checklist
    attributes:
      label: ♿️ 접근성 체크리스트 (선택)
      description: 접근성 관련 항목을 체크해주세요
      options:
        - label: Dynamic Type 지원
        - label: VoiceOver 레이블 설정
        - label: 다크모드 대응
        - label: 컬러 대비율 확인
